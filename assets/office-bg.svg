  <g transform="translate(1260 443)" filter="url(#smallShadow)">
    <path d="M58 112 32 31M63 111 83 23M69 114l45-77" fill="none" stroke="#4E9C2E" stroke-width="9" stroke-linecap="round"/>
    <g fill="#7EC850"><ellipse cx="43" cy="67" rx="22" ry="11" transform="rotate(24 43 67)"/><ellipse cx="89" cy="70" rx="22" ry="11" transform="rotate(-27 89 70)"/></g>
    <g fill="#E0536B"><circle cx="29" cy="27" r="24"/><circle cx="84" cy="20" r="25"/><circle cx="117" cy="37" r="23"/></g>
    <g fill="#F2A0B6"><circle cx="25" cy="22" r="10"/><circle cx="79" cy="15" r="11"/><circle cx="112" cy="32" r="10"/></g>
    <path d="M15 102h109l-14 94c-2 16-16 27-34 27H61c-18 0-31-11-34-27Z" fill="#C99A63"/><rect x="4" y="94" width="132" height="31" rx="15" fill="#E0B57E"/>
  </g>
  <g transform="translate(1450 443)" filter="url(#smallShadow)">
    <ellipse cx="54" cy="199" rx="78" ry="19" fill="#8A6136" opacity=".35"/>
    <path d="M53 180V55" stroke="#F0C24A" stroke-width="13" stroke-linecap="round"/><path d="M53 65 17 24" stroke="#F0C24A" stroke-width="13" stroke-linecap="round"/>
    <path d="M-9 5h76l22 60H-31Z" fill="#FBF6E0"/><path d="M-2 15h61l13 38h-88Z" fill="#F2E8C9"/>
    <ellipse cx="53" cy="186" rx="66" ry="18" fill="#F0C24A"/><ellipse cx="53" cy="181" rx="42" ry="11" fill="#F5D76E"/>
