<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cozy wood-panelled island office</title>
  <desc id="desc">A warm municipal office with a sunny window, corkboard, calendar, coffee station, desk phone, books, roses, lamp, and a broad wooden counter.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="650" gradientUnits="userSpaceOnUse"><stop stop-color="#D9A96C"/><stop offset="1" stop-color="#B98A5A"/></linearGradient>
    <linearGradient id="calm" x1="400" y1="190" x2="1200" y2="650" gradientUnits="userSpaceOnUse"><stop stop-color="#D9A96C" stop-opacity=".78"/><stop offset=".5" stop-color="#D9A96C" stop-opacity=".96"/><stop offset="1" stop-color="#B98A5A" stop-opacity=".82"/></linearGradient>
    <linearGradient id="deskTop" x1="0" y1="585" x2="0" y2="720" gradientUnits="userSpaceOnUse"><stop stop-color="#E0B57E"/><stop offset=".16" stop-color="#D9A96C"/><stop offset="1" stop-color="#B98A5A"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="690" x2="0" y2="900" gradientUnits="userSpaceOnUse"><stop stop-color="#E0B57E"/><stop offset="1" stop-color="#C99A63"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="430" gradientUnits="userSpaceOnUse"><stop stop-color="#C6EAF8"/><stop offset="1" stop-color="#8ED4F0"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".72"/><stop offset=".5" stop-color="#C6EAF8" stop-opacity=".25"/><stop offset="1" stop-color="#5FB4D8" stop-opacity=".18"/></linearGradient>
    <filter id="blur24" x="-20%" y="-30%" width="140%" height="160%"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="shadow" x="-30%" y="-40%" width="160%" height="190%"><feGaussianBlur in="SourceAlpha" stdDeviation="9" result="b"/><feOffset dy="8" result="o"/><feFlood flood-color="#5E4022" flood-opacity=".24"/><feComposite in2="o" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="smallShadow" x="-30%" y="-40%" width="160%" height="190%"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/><feOffset dy="4" result="o"/><feFlood flood-color="#5E4022" flood-opacity=".24"/><feComposite in2="o" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="windowClip"><rect x="1120" y="82" width="390" height="402" rx="27"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#wall)"/>
