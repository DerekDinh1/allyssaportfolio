<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allyssa's Island</title>
<meta name="description" content="A little island tour of life as a stay-at-home mom — and some news at the end.">
<meta name="color-scheme" content="light">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&family=Caveat:wght@400;600&display=swap">

<link rel="icon" href="assets/leaf.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/base.css?v=mail10">
<link rel="stylesheet" href="assets/site.css?v=mail10">
</head>
<body>

<a class="skip-link" href="#main" data-content="ui.skipLink" data-hide-empty>Skip to content</a>

<noscript>
  <p style="padding:1.5rem;font-family:system-ui,sans-serif;text-align:center;">
    Allyssa's Island needs JavaScript to load its content. Please enable JavaScript and refresh.
  </p>
</noscript>

<!-- ============ "Press A" start gate ============
     ACNH opens with a title screen, and browsers block audio until a
     user gesture — so this gate is both authentic and required. -->
<div class="start-gate" id="start-gate">
  <img class="start-gate__leaf ac-spin" src="assets/leaf.svg" alt="" aria-hidden="true" width="96" height="96">
  <h1 class="start-gate__title" data-content="site.title" data-hide-empty>Allyssa's Island</h1>
  <p class="start-gate__tagline" data-content="site.tagline" data-hide-empty></p>
  <button class="start-gate__button" type="button">
    <span class="ac-key ac-key--a" aria-hidden="true">A</span>
    <span data-content="ui.startPrompt">Press A to start</span>
  </button>
  <p class="start-gate__hint" data-content="ui.startHint"></p>
</div>

<!-- ============ collapsible scene nav (bottom-left) ============ -->
<nav class="presentation-nav" id="presentation-nav" hidden aria-label="Scene navigation">
  <button type="button" class="presentation-nav__toggle" aria-expanded="false" aria-controls="presentation-nav-panel">
    <img class="presentation-nav__leaf" src="assets/leaf.svg" alt="" width="22" height="22" aria-hidden="true">
    <span class="presentation-nav__chip-num" aria-hidden="true">01</span>
    <span class="presentation-nav__toggle-sr ac-sr">Open scene menu</span>
  </button>
  <div class="presentation-nav__panel" id="presentation-nav-panel" hidden>
    <button type="button" class="presentation-nav__back" disabled>
      <span class="ac-key ac-key--b" aria-hidden="true">B</span>
      <span>Back</span>
    </button>
    <ul class="presentation-nav__list" role="list"></ul>
  </div>
</nav>

<!-- ============ presentation controls ============ -->
<div class="site-controls" hidden>
  <p class="section-progress" aria-label="Scene"><span>01</span> / 05</p>
  <button class="sound-toggle" type="button" aria-pressed="false" aria-label="Sound off">
    <span class="ac-key ac-key--x" aria-hidden="true">X</span>
    <span class="sound-toggle__label" data-content="ui.soundOff">Sound off</span>
  </button>
  <a class="edit-link" data-edit-link hidden></a>
</div>

<!-- Soft ACNH leaf wipe between presentation scenes -->
<div class="scene-wipe" id="scene-wipe" hidden aria-hidden="true">
  <img class="scene-wipe__leaf" src="assets/leaf.svg" alt="" width="120" height="120">
</div>

<!-- Surprise popup: one beat at a time after Saving -->
<div class="surprise-popup" id="surprise-popup" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="surprise-title">
  <div class="surprise-popup__scrim" data-surprise-close></div>
  <div class="surprise-popup__panel">
    <h2 class="ac-sr" id="surprise-title">Island surprise</h2>
    <div class="surprise-popup__confetti" data-surprise-confetti aria-hidden="true"></div>
    <div class="surprise-popup__body" data-surprise-body></div>
    <div class="surprise-popup__footer">
      <p class="surprise-popup__progress" data-surprise-progress aria-live="polite">1 / 4</p>
      <button type="button" class="ac-btn surprise-popup__next" data-surprise-next>
        <span class="ac-key ac-key--a" aria-hidden="true">A</span>
        <span data-surprise-next-label>Next</span>
      </button>
    </div>
  </div>
</div>

<!-- Mail interrupt: paper plane flies in after Saving; click opens announcement -->
<div class="mail-interrupt" id="mail-interrupt" hidden aria-hidden="true">
  <svg class="mail-interrupt__path-def" aria-hidden="true" viewBox="0 0 100 100" preserveAspectRatio="none" focusable="false">
    <path id="mail-flight-path" fill="none" d="M 122.00 52.00 C 120.33 51.00, 115.33 45.00, 112.00 46.00 C 108.67 47.00, 105.33 58.33, 102.00 58.00 C 98.67 57.67, 95.33 44.33, 92.00 44.00 C 88.67 43.67, 85.33 55.67, 82.00 56.00 C 78.67 56.33, 75.00 46.33, 72.00 46.00 C 69.00 45.67, 66.33 53.33, 64.00 54.00 C 61.67 54.67, 59.67 50.58, 58.00 50.00 C 56.33 49.42, 55.08 50.50, 54.00 50.50 C 52.92 50.50, 52.17 50.08, 51.50 50.00 C 50.83 49.92, 50.25 50.00, 50.00 50.00"/>
  </svg>
  <button type="button" class="mail-interrupt__plane" data-mail-open aria-label="Open island news">
    <span class="mail-interrupt__craft" aria-hidden="true">
      <!-- Nose +x (right). Leftward flight = scaleX(-1) so shaded top stays up (no 180° roll). -->
      <img class="mail-interrupt__img" src="assets/paper-plane.png" alt="" width="160" height="86" draggable="false">
    </span>
  </button>
  <p class="mail-interrupt__hint" data-mail-hint hidden>Tap the letter!</p>
</div>

<main id="main">

  <!-- ---------- 01 · opening ---------- -->
  <section class="scene scene--opening" id="opening" aria-labelledby="opening-title">
    <h2 class="ac-sr" id="opening-title">Morning announcement</h2>
  </section>

  <!-- ---------- 02 · daily life ---------- -->
  <section class="scene scene--daily" id="daily" aria-labelledby="daily-title">
    <h2 class="ac-sr" id="daily-title" data-content="dailyLife.title" data-hide-empty>A Day in the Life</h2>
  </section>

  <!-- ---------- 03 · stats ---------- -->
  <section class="scene scene--stats" id="stats" aria-labelledby="stats-title">
    <h2 class="ac-sr" id="stats-title" data-content="stats.title" data-hide-empty>Resident Stats</h2>
  </section>

  <!-- ---------- 04 · gallery ---------- -->
  <section class="scene scene--gallery" id="gallery" aria-labelledby="gallery-title">
    <h2 class="ac-sr" id="gallery-title" data-content="gallery.title" data-hide-empty>Little Moments</h2>
  </section>

  <!-- ---------- 05 · reveal ---------- -->
  <section class="scene scene--reveal reveal--popup" id="reveal" aria-labelledby="reveal-title" tabindex="-1">
    <h2 class="ac-sr" id="reveal-title">Some news</h2>
  </section>
</main>

<script src="assets/content.js"></script>
<script src="assets/sections.js"></script>
<script src="assets/audio.js?v=mail10"></script>
<script src="assets/app.js?v=mail10"></script>
</body>
</html>
